<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Launcher</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; padding: 24px 16px calc(24px + env(safe-area-inset-bottom, 0px)); background: #17212b; color: #f5f7fa; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
h1 { margin: 0 4px 20px; font-size: 24px; font-weight: 650; }
h2 { margin: 28px 4px 8px; font-size: 18px; font-weight: 650; }
.tile { display: flex; align-items: center; gap: 16px; width: 100%; min-height: 96px; margin: 0 0 14px; padding: 20px 18px; background: #243445; color: inherit; border: 0; border-radius: 18px; text-align: left; font: inherit; cursor: pointer; }
.tile:active, .btn:active { opacity: .75; }
.tile:focus-visible, .btn:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid #6ab3f3; outline-offset: 2px; }
.name { display: block; font-size: 21px; font-weight: 650; }
.note { display: block; margin-top: 2px; font-size: 15px; color: #9fb0c0; }
.hint { margin: 0 4px 12px; font-size: 14px; line-height: 1.5; color: #9fb0c0; }
textarea, input { width: 100%; background: #0e1621; color: inherit; border: 1px solid #2f4256; border-radius: 14px; padding: 14px; font: inherit; font-size: 16px; }
textarea { min-height: 150px; resize: vertical; }
input { margin-top: 10px; }
.row { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.btn { flex: 1 1 140px; min-height: 48px; padding: 0 14px; border: 0; border-radius: 14px; background: #243445; color: inherit; font: inherit; font-weight: 600; cursor: pointer; }
.btn.claude { background: #c4703f; }
.btn.gpt { background: #10a37f; }
.btn.hermes { background: #6a5fd8; }
#status { min-height: 22px; margin: 12px 4px 0; font-size: 14px; color: #8fd3a8; }
#log { margin: 10px 4px 0; padding: 0; list-style: none; font-size: 13px; color: #9fb0c0; }
#log li { padding: 6px 0; border-top: 1px solid #243445; }
</style>
</head>
<body>
<h1>My Launcher</h1>

<button class="tile" type="button" data-url="https://claude.ai/new">
<svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true"><rect width="52" height="52" rx="14" fill="#c4703f"/><g stroke="#fff" stroke-width="3.5" stroke-linecap="round"><line x1="26" y1="12" x2="26" y2="40"/><line x1="12" y1="26" x2="40" y2="26"/><line x1="16" y1="16" x2="36" y2="36"/><line x1="36" y1="16" x2="16" y2="36"/></g></svg>
<span><span class="name">Claude</span><span class="note">Start a new chat</span></span>
</button>

<button class="tile" type="button" data-url="https://chatgpt.com/">
<svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true"><rect width="52" height="52" rx="14" fill="#10a37f"/><polygon points="26,11 39,18.5 39,33.5 26,41 13,33.5 13,18.5" fill="none" stroke="#fff" stroke-width="3.5" stroke-linejoin="round"/><circle cx="26" cy="26" r="4" fill="#fff"/></svg>
<span><span class="name">ChatGPT</span><span class="note">Open ChatGPT</span></span>
</button>

<button class="tile" type="button" id="hermesTile">
<svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true"><rect width="52" height="52" rx="14" fill="#6a5fd8"/><text x="26" y="35" text-anchor="middle" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#fff">H</text></svg>
<span><span class="name">Hermes</span><span class="note">Open your Hermes bot</span></span>
</button>

<h2>Handoff: ChatGPT → Claude → Hermes</h2>
<p class="hint">Paste a reply here, then send it on. Nothing leaves your device except through the button you tap. Do not paste keys or tokens.</p>
<label for="msg" class="hint">Message</label>
<textarea id="msg" placeholder="Paste the reply you want to pass on"></textarea>
<div class="row">
<button class="btn" type="button" id="paste">Paste from clipboard</button>
<button class="btn" type="button" id="clear">Clear</button>
</div>
<div class="row">
<button class="btn claude" type="button" id="toClaude">Copy + open Claude</button>
<button class="btn gpt" type="button" id="toGpt">Copy + open ChatGPT</button>
</div>
<div class="row">
<button class="btn hermes" type="button" id="toHermes">Send to Hermes (Telegram)</button>
</div>
<label for="hermesUser" class="hint" style="display:block;margin-top:14px">Hermes bot username (optional, saved on this device)</label>
<input id="hermesUser" type="text" placeholder="@YourHermesBot" autocapitalize="none" autocomplete="off">
<div class="row"><button class="btn" type="button" id="openHermes">Open Hermes chat</button></div>
<div id="status" role="status" aria-live="polite"></div>
<ul id="log"></ul>

<script>
var tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  try { tg.setHeaderColor("#1f2c3a"); tg.setBackgroundColor("#17212b"); } catch (e) {}
}

function openExternal(url) {
  if (tg && tg.openLink) { tg.openLink(url); } else { window.open(url, "_blank"); }
}
function openTelegram(url) {
  if (tg && tg.openTelegramLink) { tg.openTelegramLink(url); } else { window.open(url, "_blank"); }
}
document.querySelectorAll(".tile[data-url]").forEach(function (b) {
  b.addEventListener("click", function () { openExternal(b.getAttribute("data-url")); });
});

var $ = function (id) { return document.getElementById(id); };
var msg = $("msg"), statusEl = $("status"), logEl = $("log"), userEl = $("hermesUser");
var store = {
  get: function (k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } },
  set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};

msg.value = store.get("handoff.msg");
userEl.value = store.get("handoff.hermesUser");
msg.addEventListener("input", function () { store.set("handoff.msg", msg.value); });
userEl.addEventListener("input", function () { store.set("handoff.hermesUser", userEl.value.trim()); });

function say(t) { statusEl.textContent = t; }
function text() { return msg.value.trim(); }

function copy(t) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(t).then(function () { return true; }, function () { return legacyCopy(t); });
  }
  return Promise.resolve(legacyCopy(t));
}
function legacyCopy(t) {
  try {
    var ta = document.createElement("textarea");
    ta.value = t; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    var ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

function addLog(dest) {
  var items = [];
  try { items = JSON.parse(store.get("handoff.log") || "[]"); } catch (e) {}
  items.unshift({ dest: dest, at: new Date().toLocaleString(), len: text().length });
  items = items.slice(0, 10);
  store.set("handoff.log", JSON.stringify(items));
  renderLog();
}
function renderLog() {
  var items = [];
  try { items = JSON.parse(store.get("handoff.log") || "[]"); } catch (e) {}
  logEl.innerHTML = "";
  items.forEach(function (i) {
    var li = document.createElement("li");
    li.textContent = i.at + " → " + i.dest + " (" + i.len + " chars)";
    logEl.appendChild(li);
  });
}
renderLog();

function needText() {
  if (!text()) { say("Nothing to send yet. Paste a message first."); return false; }
  return true;
}

$("paste").addEventListener("click", function () {
  if (navigator.clipboard && navigator.clipboard.readText) {
    navigator.clipboard.readText().then(function (t) {
      msg.value = t; store.set("handoff.msg", t); say("Pasted from clipboard.");
    }, function () { say("Clipboard read was blocked. Long-press the box and choose Paste."); });
  } else { say("Clipboard read is not available here. Long-press the box and choose Paste."); }
});
$("clear").addEventListener("click", function () { msg.value = ""; store.set("handoff.msg", ""); say("Cleared."); });

function viaCopy(dest, base) {
  if (!needText()) return;
  var t = text();
  copy(t).then(function (ok) {
    var url = base + (t.length <= 4000 ? "?q=" + encodeURIComponent(t) : "");
    addLog(dest);
    say((ok ? "Copied. " : "Copy failed, paste manually. ") + "Opening " + dest + (t.length > 4000 ? " (too long to prefill; paste it)." : "."));
    openExternal(url);
  });
}
$("toClaude").addEventListener("click", function () { viaCopy("Claude", "https://claude.ai/new"); });
$("toGpt").addEventListener("click", function () { viaCopy("ChatGPT", "https://chatgpt.com/"); });

$("toHermes").addEventListener("click", function () {
  if (!needText()) return;
  var t = text();
  if (t.length > 3500) { say("Too long for a Telegram share link (" + t.length + " chars, limit about 3500). Shorten it or send in parts."); return; }
  copy(t);
  addLog("Hermes");
  say("Telegram will ask which chat. Pick your Hermes bot and tap send.");
  openTelegram("https://t.me/share/url?url=&text=" + encodeURIComponent(t));
});

function goHermes() {
  var u = userEl.value.trim().replace(/^@/, "").replace(/^https?:\/\/t\.me\//, "");
  if (!/^[A-Za-z0-9_]{4,32}$/.test(u)) { say("Enter the Hermes bot username first (letters, digits, underscore)."); return; }
  openTelegram("https://t.me/" + u);
}
$("openHermes").addEventListener("click", goHermes);
$("hermesTile").addEventListener("click", function () {
  if (!userEl.value.trim()) { userEl.scrollIntoView({ behavior: "smooth", block: "center" }); userEl.focus(); say("Type your Hermes bot username once, then tap the Hermes tile again."); return; }
  goHermes();
});
</script>
</body>
</html>
